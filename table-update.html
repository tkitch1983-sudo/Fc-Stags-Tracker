<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update League Table</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111d;color:#fff}.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}h1{font-size:24px;margin:4px 0 8px}.sub{color:#a9bad0;margin-bottom:16px}.card{background:#0d1b2a;border:1px solid #28405b;border-radius:16px;padding:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border-bottom:1px solid #28405b;padding:9px 8px;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}input{width:54px;background:#081522;color:#fff;border:1px solid #3a5878;border-radius:8px;padding:8px;text-align:center;font-size:16px}.team{width:210px;text-align:left}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:700;background:#15b8d4;color:#00131a}.status{margin-top:12px;min-height:24px;color:#b9cbe0}.ok{color:#67e8a5}.err{color:#ff8a8a}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Update Full League Table</h1>
  <div class="sub">The table from your screenshot is already filled in. Change anything you need, then press one button.</div>
  <div class="card">
    <table>
      <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>F</th><th>A</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button id="saveBtn">Save Whole Table</button>
  <div id="status" class="status"></div>
</div>
<iframe id="appFrame" src="/"></iframe>
<script>
const initial = [
  {team:'Hartlepool Stags',p:2,w:2,d:0,l:0,f:12,a:1},
  {team:'Middleton Rangers',p:2,w:2,d:0,l:0,f:8,a:1},
  {team:'Nunthorpe',p:2,w:2,d:0,l:0,f:13,a:9},
  {team:'Stockton Town',p:2,w:1,d:1,l:0,f:9,a:3},
  {team:'Guisborough Town',p:2,w:1,d:0,l:1,f:8,a:8},
  {team:'Kader',p:2,w:0,d:1,l:1,f:4,a:5},
  {team:'Redcar Town',p:2,w:0,d:1,l:1,f:6,a:9},
  {team:'Northallerton Blacks',p:2,w:0,d:1,l:1,f:2,a:9},
  {team:'Billingham',p:2,w:0,d:0,l:2,f:2,a:9},
  {team:'Ferryhill',p:2,w:0,d:0,l:2,f:1,a:11}
];
const body = document.getElementById('rows');
body.innerHTML = initial.map((r,i)=>`<tr data-i="${i}"><td>${i+1}</td><td><input class="team" data-k="team" value="${r.team}"></td>${['p','w','d','l','f','a'].map(k=>`<td><input inputmode="numeric" type="number" min="0" data-k="${k}" value="${r[k]}"></td>`).join('')}</tr>`).join('');
function collect(){return [...body.querySelectorAll('tr')].map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.dataset.k==='team'?x.value.trim():(parseInt(x.value,10)||0));return o;}).filter(x=>x.team);}
function wait(ms){return new Promise(r=>setTimeout(r,ms));}
async function waitForApp(w){for(let i=0;i<80;i++){try{if(w.eval("typeof save==='function' && typeof render==='function' && typeof standings!=='undefined'")) return true;}catch(e){}await wait(250);}return false;}
document.getElementById('saveBtn').addEventListener('click', async()=>{
  const btn=document.getElementById('saveBtn'), status=document.getElementById('status'), frame=document.getElementById('appFrame');
  btn.disabled=true; btn.textContent='Saving…'; status.className='status'; status.textContent='Loading the main app…';
  try{
    const w=frame.contentWindow;
    if(!(await waitForApp(w))) throw new Error('The main app did not finish loading.');
    const data=collect();
    const code=`standings = ${JSON.stringify(data)}; await save(); render(); true`;
    await w.eval(`(async()=>{${code}})()`);
    status.className='status ok'; status.textContent='League table saved successfully.';
  }catch(e){status.className='status err'; status.textContent='Could not save the table. Reload this page and try again.';}
  btn.disabled=false; btn.textContent='Save Whole Table';
});
</script>
</body>
</html>
