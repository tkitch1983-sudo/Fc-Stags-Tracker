<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update League Table</title>
<style>
  :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#07111d;color:#fff}.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}h1{font-size:24px;margin:4px 0 8px}.sub{color:#a9bad0;margin-bottom:16px}.card{background:#0d1b2a;border:1px solid #28405b;border-radius:16px;padding:14px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border-bottom:1px solid #28405b;padding:9px 8px;text-align:center}th:nth-child(2),td:nth-child(2){text-align:left}input{width:54px;background:#081522;color:#fff;border:1px solid #3a5878;border-radius:8px;padding:8px;text-align:center;font-size:16px}.team{width:210px;text-align:left}button{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;font-size:18px;font-weight:700;background:#15b8d4;color:#00131a}.status{margin-top:12px;min-height:24px;color:#b9cbe0}.ok{color:#67e8a5}.err{color:#ff8a8a}iframe{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;border:0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Update Full League Table</h1>
  <div class="sub">Matchday 3 table is filled in below.</div>
  <div class="card">
    <table>
      <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>F</th><th>A</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <button id="saveBtn">Save Whole Table</button>
  <div id="status" class="status"></div>
</div>
<iframe id="appFrame" src="/"></iframe>
<script>
const initial = [
  {team:'Hartlepool Stags',p:3,w:3,d:0,l:0,f:14,a:1},
  {team:'Nunthorpe',p:3,w:3,d:0,l:0,f:21,a:12},
  {team:'Guisborough Town',p:3,w:2,d:0,l:1,f:13,a:9},
  {team:'Middleton Rangers',p:3,w:2,d:0,l:1,f:8,a:5},
  {team:'Kader',p:3,w:1,d:1,l:1,f:10,a:6},
  {team:'Stockton Town',p:3,w:1,d:1,l:1,f:9,a:5},
  {team:'Redcar Town',p:3,w:1,d:1,l:1,f:10,a:9},
  {team:'Northallerton Blacks',p:3,w:0,d:1,l:2,f:5,a:17},
  {team:'Billingham',p:3,w:0,d:0,l:3,f:3,a:14},
  {team:'Ferryhill',p:3,w:0,d:0,l:3,f:2,a:17}
];
const body=document.getElementById('rows');
body.innerHTML=initial.map((r,i)=>`<tr><td>${i+1}</td><td><input class="team" data-k="team" value="${r.team}"></td>${['p','w','d','l','f','a'].map(k=>`<td><input type="number" min="0" inputmode="numeric" data-k="${k}" value="${r[k]}"></td>`).join('')}</tr>`).join('');
function collect(){return [...body.querySelectorAll('tr')].map(tr=>{const o={};tr.querySelectorAll('input').forEach(x=>o[x.dataset.k]=x.dataset.k==='team'?x.value.trim():(parseInt(x.value,10)||0));return o;}).filter(x=>x.team);}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function waitForApp(w){for(let i=0;i<100;i++){try{if(w.eval("typeof save==='function' && typeof render==='function' && typeof load==='function' && typeof standings!=='undefined'"))return true;}catch(e){}await wait(200);}return false;}
async function saveWholeTable(){
  const btn=document.getElementById('saveBtn'),status=document.getElementById('status'),frame=document.getElementById('appFrame');
  btn.disabled=true;btn.textContent='Saving…';status.className='status';status.textContent='Loading current shared data…';
  try{
    const w=frame.contentWindow;
    if(!(await waitForApp(w)))throw new Error('app not ready');
    await w.eval(`(async()=>{await load();return true;})()`);
    const data=collect();
    const ok=await w.eval(`(async()=>{standings=${JSON.stringify(data)};const saved=await save();render();return saved;})()`);
    if(ok===false)throw new Error('save failed');
    status.className='status ok';status.textContent='League table saved successfully.';
  }catch(e){status.className='status err';status.textContent='Could not save the table. Reload and try again.';}
  btn.disabled=false;btn.textContent='Save Whole Table';
}
document.getElementById('saveBtn').addEventListener('click',saveWholeTable);
if(new URLSearchParams(location.search).get('apply')==='1')setTimeout(saveWholeTable,700);
</script>
</body>
</html>
